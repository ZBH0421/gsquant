name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        run: |
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          git diff --check "$BASE" HEAD

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Python tests
        run: python -m pytest projects/cot-radar/pipeline/tests -q
      - name: Ruff
        run: python -m ruff check projects/cot-radar/pipeline/src projects/cot-radar/pipeline/tests
      - name: mypy
        run: python -m mypy projects/cot-radar/pipeline/src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cot-radar/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/cot-radar/web/package.json
      - run: npm install
      - name: Frontend tests
        run: npm test -- --run
      - name: TypeScript check
        run: npx tsc -b --pretty false
      - name: Vite production build
        run: npx vite build
