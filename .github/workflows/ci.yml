name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest projects/cot-radar/pipeline/tests -q
      - run: python -m ruff check projects/cot-radar/pipeline/src projects/cot-radar/pipeline/tests
      - run: python -m mypy projects/cot-radar/pipeline/src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cot-radar/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/cot-radar/web/package.json
      - run: npm install
      - run: npm test -- --run
      - run: npm run build

  live-data:
    if: (github.event_name == 'pull_request' && github.head_ref == 'codex/cot-radar-mvp') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/cot-radar-mvp')
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cot-radar-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Generate from live CFTC and Stooq data
        run: python -m cot_radar.cli --price-provider stooq
      - name: Validate generated artifacts
        run: |
          test -s projects/cot-radar/data/derived/dashboard.json
          test -s projects/cot-radar/data/derived/signals.csv
          test -s projects/cot-radar/web/public/data/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("projects/cot-radar/data/derived/dashboard.json").read_text())
          status = json.loads(Path("projects/cot-radar/data/derived/status.json").read_text())
          assert {item["symbol"] for item in dashboard["markets"]} == {"ES", "NQ"}
          assert status["price_provider"] == "stooq"
          PY
      - name: Commit live derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cot-radar/data/derived projects/cot-radar/web/public/data
          git diff --cached --quiet || git commit -m "data: generate live COT radar artifacts [skip ci]"
          git push
