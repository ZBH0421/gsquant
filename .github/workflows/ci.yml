name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest projects/cot-radar/pipeline/tests -q
      - run: python -m ruff check projects/cot-radar/pipeline/src projects/cot-radar/pipeline/tests
      - run: python -m mypy projects/cot-radar/pipeline/src
