name: Live data smoke

on:
  push:
    branches:
      - codex/cot-radar-mvp
    paths:
      - .github/workflows/live-data-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cot-radar-live-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cot-radar-mvp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Generate from live CFTC and Stooq data
        run: python -m cot_radar.cli --price-provider stooq
      - name: Validate generated artifacts
        run: |
          test -s projects/cot-radar/data/derived/dashboard.json
          test -s projects/cot-radar/data/derived/signals.csv
          test -s projects/cot-radar/web/public/data/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("projects/cot-radar/data/derived/dashboard.json").read_text())
          status = json.loads(Path("projects/cot-radar/data/derived/status.json").read_text())
          assert {item["symbol"] for item in dashboard["markets"]} == {"ES", "NQ"}
          assert status["price_provider"] == "stooq"
          PY
      - name: Commit live derived data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cot-radar/data/derived projects/cot-radar/web/public/data
          git diff --cached --quiet || git commit -m "data: generate live COT radar artifacts [skip ci]"
          git push
