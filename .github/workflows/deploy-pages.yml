name: Deploy COT radar to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cot-radar/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify analytics
        run: |
          python -m pytest projects/cot-radar/pipeline/tests -q
          python -m ruff check projects/cot-radar/pipeline/src projects/cot-radar/pipeline/tests
          python -m mypy projects/cot-radar/pipeline/src
      - name: Generate current data
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python -m cot_radar.cli --price-provider auto
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/cot-radar/web/package.json
      - name: Verify and build dashboard
        working-directory: projects/cot-radar/web
        run: |
          npm install
          npm test -- --run
          npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/cot-radar
          cp -R projects/cot-radar/web/dist/. pages/cot-radar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
