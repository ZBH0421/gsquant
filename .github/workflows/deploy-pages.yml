name: Deploy COT radar to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-build-deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Deploy COT Radar'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cot-radar/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify analytics
        run: |
          python -m pytest projects/cot-radar/pipeline/tests -q
          python -m ruff check projects/cot-radar/pipeline/src projects/cot-radar/pipeline/tests
          python -m mypy projects/cot-radar/pipeline/src
      - name: Generate and validate current data
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python -m cot_radar.cli --price-provider auto
          test -s projects/cot-radar/data/derived/dashboard.json
          test -s projects/cot-radar/data/derived/signals.csv
          test -s projects/cot-radar/web/public/data/status.json
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("projects/cot-radar/data/derived/dashboard.json").read_text())
          assert {market["symbol"] for market in dashboard["markets"]} == {"ES", "NQ"}
          PY
      - name: Commit validated weekly snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cot-radar/data/derived projects/cot-radar/web/public/data
          git diff --cached --quiet || git commit -m "data: refresh weekly COT radar artifacts [skip ci]"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/cot-radar/web/package.json
      - name: Verify and build dashboard
        working-directory: projects/cot-radar/web
        run: |
          npm install
          npm test -- --run
          npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p pages/cot-radar
          cp -R projects/cot-radar/web/dist/. pages/cot-radar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
